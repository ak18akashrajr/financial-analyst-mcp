<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Portfolio AI architecture: the chat UI sends a request through Supabase Edge auth and rate limiting to the portfolio-ai coordinator agent, which for Groq picks a model via keyword routing, calls MCP tools over JSON-RPC against portfolio-mcp-server, which runs SQL against Postgres under RLS, and streams a token response back over SSE. Dashboard pages instead query Postgres directly via usePortfolio, bypassing the agent and MCP hop.">
  <style>
    text { font-family: 'IBM Plex Sans', 'Segoe UI', ui-sans-serif, system-ui, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', 'Cascadia Code', ui-monospace, Consolas, monospace; }
    .label { font-weight: 600; font-size: 12px; }
    .sub { font-size: 9.5px; }
    .edge { font-size: 9px; fill: #9a988e; }
    .group { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; fill: #9a988e; }
    .box { stroke-width: 1.4; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#c9c8c0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="760" fill="#101113"/>

  <!-- ================= EDGES ================= -->
  <g stroke="#c9c8c0" stroke-width="1.3" fill="none" opacity="0.8">
    <line x1="150" y1="78" x2="150" y2="118" marker-end="url(#arrow)"/>
    <line x1="185" y1="148" x2="330" y2="148" marker-end="url(#arrow)"/>
    <line x1="150" y1="178" x2="150" y2="212" marker-end="url(#arrow)"/>
    <line x1="150" y1="252" x2="150" y2="296" marker-end="url(#arrow)"/>
    <line x1="255" y1="330" x2="330" y2="330" marker-end="url(#arrow)"/>
    <line x1="440" y1="330" x2="560" y2="330" marker-end="url(#arrow)"/>
    <line x1="150" y1="356" x2="150" y2="400" marker-end="url(#arrow)"/>
    <line x1="180" y1="384" x2="330" y2="440" marker-end="url(#arrow)"/>
    <line x1="425" y1="452" x2="560" y2="452" marker-end="url(#arrow)"/>
    <line x1="655" y1="480" x2="655" y2="520" marker-end="url(#arrow)"/>
    <line x1="655" y1="560" x2="655" y2="600" marker-end="url(#arrow)"/>
    <line x1="655" y1="634" x2="655" y2="670" marker-end="url(#arrow)"/>
    <line x1="330" y1="468" x2="185" y2="392" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    <line x1="560" y1="345" x2="256" y2="322" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    <line x1="120" y1="330" x2="60" y2="330" marker-end="url(#arrow)"/>
    <line x1="60" y1="330" x2="60" y2="60" marker-end="none"/>
    <line x1="60" y1="60" x2="115" y2="52" marker-end="url(#arrow)"/>
  </g>

  <!-- ================= NODES ================= -->

  <g>
    <rect class="box" x="90" y="24" width="120" height="54" rx="6" fill="#182c42" stroke="#5c96d6"/>
    <text class="label" x="150" y="47" text-anchor="middle" fill="#a9cdf2">Chat UI</text>
    <text class="mono sub" x="150" y="63" text-anchor="middle" fill="#a9cdf2">React · SSE reader</text>
  </g>

  <g>
    <rect class="box" x="90" y="118" width="120" height="60" rx="6" fill="#182c42" stroke="#5c96d6"/>
    <text class="label" x="150" y="142" text-anchor="middle" fill="#a9cdf2">portfolio-ai</text>
    <text class="mono sub" x="150" y="157" text-anchor="middle" fill="#a9cdf2">Deno edge function</text>
    <text class="mono sub" x="150" y="170" text-anchor="middle" fill="#a9cdf2">POST /portfolio-ai</text>
  </g>

  <g>
    <rect class="box" x="330" y="120" width="130" height="54" rx="6" fill="#182c42" stroke="#5c96d6"/>
    <text class="label" x="395" y="143" text-anchor="middle" fill="#a9cdf2">Supabase Auth</text>
    <text class="mono sub" x="395" y="159" text-anchor="middle" fill="#a9cdf2">auth.ts · single-user JWT</text>
  </g>

  <g>
    <rect class="box" x="90" y="212" width="120" height="40" rx="6" fill="#182c42" stroke="#5c96d6"/>
    <text class="label" x="150" y="230" text-anchor="middle" fill="#a9cdf2">Rate limit</text>
    <text class="mono sub" x="150" y="244" text-anchor="middle" fill="#a9cdf2">rate-limit.ts</text>
  </g>

  <rect x="70" y="285" width="560" height="130" rx="10" fill="none" stroke="#4fae76" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.55"/>
  <text class="mono group" x="80" y="278">Agent loop (agentic zone)</text>

  <g>
    <rect class="box" x="80" y="296" width="175" height="60" rx="6" fill="#173323" stroke="#4fae76"/>
    <text class="label" x="167" y="320" text-anchor="middle" fill="#8fd8ab">Coordinator agent</text>
    <text class="mono sub" x="167" y="336" text-anchor="middle" fill="#8fd8ab">portfolio-ai/index.ts</text>
    <text class="mono sub" x="167" y="349" text-anchor="middle" fill="#8fd8ab">tool-call loop, bounded concurrency</text>
  </g>

  <g>
    <rect class="box" x="330" y="300" width="110" height="60" rx="6" fill="#173323" stroke="#4fae76"/>
    <text class="label" x="385" y="322" text-anchor="middle" fill="#8fd8ab">Router</text>
    <text class="mono sub" x="385" y="337" text-anchor="middle" fill="#8fd8ab">router.ts</text>
    <text class="mono sub" x="385" y="349" text-anchor="middle" fill="#8fd8ab">keyword-routed, Groq only</text>
  </g>

  <g>
    <rect class="box" x="560" y="296" width="200" height="70" rx="6" fill="#3a2e13" stroke="#d1a447"/>
    <text class="label" x="660" y="316" text-anchor="middle" fill="#eccd8a">LLM providers</text>
    <line x1="660" y1="323" x2="660" y2="358" stroke="#d1a447" stroke-width="1" opacity="0.5"/>
    <text class="mono sub" x="610" y="336" text-anchor="middle" fill="#eccd8a">Groq</text>
    <text class="mono sub" x="610" y="349" text-anchor="middle" fill="#eccd8a">gpt-oss-20b/120b</text>
    <text class="mono sub" x="610" y="360" text-anchor="middle" fill="#eccd8a">default</text>
    <text class="mono sub" x="710" y="336" text-anchor="middle" fill="#eccd8a">Anthropic</text>
    <text class="mono sub" x="710" y="349" text-anchor="middle" fill="#eccd8a">Claude Sonnet 5</text>
    <text class="mono sub" x="710" y="360" text-anchor="middle" fill="#eccd8a">if key set</text>
  </g>

  <text class="edge" x="620" y="288">escalates simple→complex if a "simple" turn needs too many tool calls</text>

  <g>
    <rect class="box" x="90" y="400" width="120" height="50" rx="6" fill="#182c42" stroke="#5c96d6"/>
    <text class="label" x="150" y="422" text-anchor="middle" fill="#a9cdf2">Logger</text>
    <text class="mono sub" x="150" y="437" text-anchor="middle" fill="#a9cdf2">logger.ts · JSON lines</text>
  </g>

  <g>
    <rect class="box" x="330" y="422" width="120" height="52" rx="6" fill="#182c42" stroke="#5c96d6"/>
    <text class="label" x="390" y="444" text-anchor="middle" fill="#a9cdf2">MCP client</text>
    <text class="mono sub" x="390" y="459" text-anchor="middle" fill="#a9cdf2">mcp-client.ts</text>
    <text class="mono sub" x="390" y="470" text-anchor="middle" fill="#a9cdf2">JSON-RPC 2.0</text>
  </g>

  <g>
    <rect class="box" x="560" y="422" width="190" height="58" rx="6" fill="#182c42" stroke="#5c96d6"/>
    <text class="label" x="655" y="444" text-anchor="middle" fill="#a9cdf2">portfolio-mcp-server</text>
    <text class="mono sub" x="655" y="459" text-anchor="middle" fill="#a9cdf2">Streamable HTTP endpoint</text>
    <text class="mono sub" x="655" y="471" text-anchor="middle" fill="#a9cdf2">hand-rolled, no SDK transport</text>
  </g>

  <g>
    <rect class="box" x="480" y="520" width="350" height="40" rx="6" fill="#26282a" stroke="#6f716c"/>
    <text class="label" x="655" y="536" text-anchor="middle" fill="#c7c5bc">mcp-tools.ts registry</text>
    <text class="mono sub" x="655" y="550" text-anchor="middle" fill="#c7c5bc">get_portfolio_summary · list_holdings · get_exposure_by_* · get_risk_metrics · run_stress_test · check_limit_breaches · compare_to_benchmark · get_period_performance · list_transactions</text>
  </g>

  <g>
    <rect class="box" x="565" y="600" width="180" height="34" rx="6" fill="#182c42" stroke="#5c96d6"/>
    <text class="label" x="655" y="621" text-anchor="middle" fill="#a9cdf2">RLS — authenticated only</text>
  </g>

  <g>
    <path d="M 570 690 v -40 a85,10 0 0 1 170,0 v 40 a85,10 0 0 1 -170,0 z" fill="#26282a" stroke="#6f716c" stroke-width="1.4"/>
    <ellipse cx="655" cy="650" rx="85" ry="10" fill="#26282a" stroke="#6f716c" stroke-width="1.4"/>
    <text class="label" x="655" y="672" text-anchor="middle" fill="#c7c5bc">Postgres</text>
    <text class="mono sub" x="655" y="686" text-anchor="middle" fill="#c7c5bc">transactions · cash_settings</text>
    <text class="mono sub" x="655" y="697" text-anchor="middle" fill="#c7c5bc">current_prices · symbol_metadata</text>
  </g>

  <g>
    <rect class="box" x="850" y="24" width="180" height="54" rx="6" fill="#182c42" stroke="#5c96d6"/>
    <text class="label" x="940" y="47" text-anchor="middle" fill="#a9cdf2">Dashboard pages</text>
    <text class="mono sub" x="940" y="63" text-anchor="middle" fill="#a9cdf2">Holdings · Exposure · Reports</text>
  </g>
  <g>
    <rect class="box" x="850" y="118" width="180" height="52" rx="6" fill="#182c42" stroke="#5c96d6"/>
    <text class="label" x="940" y="140" text-anchor="middle" fill="#a9cdf2">usePortfolio hook</text>
    <text class="mono sub" x="940" y="155" text-anchor="middle" fill="#a9cdf2">browser → Supabase (anon key)</text>
  </g>
  <g>
    <rect class="box" x="850" y="212" width="180" height="46" rx="6" fill="#26282a" stroke="#6f716c"/>
    <text class="label" x="940" y="231" text-anchor="middle" fill="#c7c5bc">src/lib pure functions</text>
    <text class="mono sub" x="940" y="245" text-anchor="middle" fill="#c7c5bc">xirr · taxCalculator · projectionEngine</text>
  </g>
  <line x1="940" y1="78" x2="940" y2="118" stroke="#c9c8c0" stroke-width="1.3" opacity="0.8" marker-end="url(#arrow)"/>
  <line x1="940" y1="170" x2="940" y2="212" stroke="#c9c8c0" stroke-width="1.3" opacity="0.8" marker-end="url(#arrow)"/>
  <line x1="850" y1="145" x2="750" y2="145" stroke="#c9c8c0" stroke-width="1.3" stroke-dasharray="3 3" opacity="0.65" marker-end="url(#arrow)"/>
  <text class="edge" x="797" y="138" text-anchor="middle">same RLS, no MCP hop</text>
  <path d="M 940 258 C 940 500, 745 660, 745 660" stroke="#c9c8c0" stroke-width="1.3" fill="none" stroke-dasharray="3 3" opacity="0.65" marker-end="url(#arrow)"/>

  <text class="edge mono" x="10" y="325" transform="rotate(-90 10 325)">SSE stream</text>
  <text class="edge mono" x="212" y="141">verify JWT</text>
  <text class="edge mono" x="212" y="230">per-user, per-minute</text>
  <text class="edge mono" x="260" y="325">simple / complex?</text>
  <text class="edge mono" x="185" y="405">structured JSON, per call</text>
  <text class="edge mono" x="435" y="435">tools/call</text>
  <text class="edge mono" x="490" y="447">tools/list, tools/call</text>
  <text class="edge mono" x="660" y="514">dispatches by name</text>
  <text class="edge mono" x="660" y="595">SQL query</text>

  <text class="mono group" x="70" y="725">legend</text>
  <g class="mono sub">
    <rect x="70" y="733" width="10" height="10" rx="2" fill="#173323" stroke="#4fae76"/>
    <text x="86" y="742" fill="#c7c5bc">agentic — reasons, decides, calls tools</text>
    <rect x="330" y="733" width="10" height="10" rx="2" fill="#182c42" stroke="#5c96d6"/>
    <text x="346" y="742" fill="#c7c5bc">software — deterministic app/infra code</text>
    <rect x="640" y="733" width="10" height="10" rx="2" fill="#3a2e13" stroke="#d1a447"/>
    <text x="656" y="742" fill="#c7c5bc">third-party LLM providers</text>
    <rect x="890" y="733" width="10" height="10" rx="2" fill="#26282a" stroke="#6f716c"/>
    <text x="906" y="742" fill="#c7c5bc">data store / leaf endpoint</text>
  </g>
</svg>
